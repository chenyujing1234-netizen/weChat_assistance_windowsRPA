<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>测试二维码API</title>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .log {
            margin-top: 20px;
            padding: 10px;
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        img {
            margin-top: 20px;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>测试二维码API</h1>
        
        <div>
            <label for="phone">手机号:</label>
            <input type="text" id="phone" value="15280006510">
        </div>
        
        <div>
            <label for="subject">商品名称:</label>
            <input type="text" id="subject" value="微信助手-月卡">
        </div>
        
        <div>
            <label for="amount">金额:</label>
            <input type="text" id="amount" value="99">
        </div>
        
        <button id="testBtn">测试获取二维码</button>
        
        <div class="log" id="logOutput"></div>
        
        <div>
            <h3>二维码结果:</h3>
            <img id="qrCodeResult" src="" alt="二维码结果">
        </div>
    </div>
    
    <script>
        // 用于输出日志
        function log(message) {
            const logElement = document.getElementById('logOutput');
            const timestamp = new Date().toLocaleTimeString();
            logElement.innerHTML += `[${timestamp}] ${message}\n`;
            logElement.scrollTop = logElement.scrollHeight;
            console.log(message);
        }
        
        // 全局变量，用于存储backend对象
        let backend = null;
        
        // 初始化WebChannel
        function initWebChannel() {
            log('尝试初始化WebChannel...');
            try {
                if (window.qt && window.qt.webChannelTransport) {
                    const channel = new QWebChannel(qt.webChannelTransport, function(channel) {
                        backend = channel.objects.backend;
                        log('WebChannel初始化成功，已获取backend对象');
                        
                        // 测试简单的方法调用
                        if (backend.test_message) {
                            backend.test_message('Hello from JavaScript').then(function(response) {
                                log('测试消息响应: ' + response);
                            }).catch(function(error) {
                                log('测试消息调用失败: ' + error);
                            });
                        }
                    });
                } else {
                    log('未检测到qt.webChannelTransport');
                }
            } catch (e) {
                log('WebChannel初始化异常: ' + e);
            }
        }
        
        // 获取二维码的函数
        function getPaymentQrCode() {
            const phone = document.getElementById('phone').value;
            const subject = document.getElementById('subject').value;
            const amount = document.getElementById('amount').value;
            const qrCodeImg = document.getElementById('qrCodeResult');
            
            log('开始获取支付二维码...');
            log(`参数: phone=${phone}, subject=${subject}, amount=${amount}`);
            
            // 显示加载中
            qrCodeImg.src = '../img/loading.gif';
            
            if (backend && backend.get_payment_qr_code) {
                log('使用backend对象调用get_payment_qr_code');
                try {
                    backend.get_payment_qr_code(phone, subject, amount).then(function(result) {
                        log('获取二维码结果: ' + result);
                        handleQrCodeResponse(result, qrCodeImg);
                    }).catch(function(error) {
                        log('调用后端接口出错: ' + error);
                        qrCodeImg.src = '';
                    });
                } catch (e) {
                    log('调用后端接口时发生异常: ' + e);
                    qrCodeImg.src = '';
                }
            } else {
                log('未找到backend对象或get_payment_qr_code方法');
                qrCodeImg.src = '';
            }
        }
        
        // 处理二维码响应
        function handleQrCodeResponse(result, qrCodeImg) {
            try {
                log('处理二维码响应...');
                const response = JSON.parse(result);
                if (response.success) {
                    log('获取二维码成功，设置图片');
                    qrCodeImg.src = response.qr_code;
                } else {
                    log('获取二维码失败: ' + response.message);
                    qrCodeImg.src = '';
                }
            } catch (e) {
                log('解析二维码响应失败: ' + e);
                log('原始响应: ' + result);
                qrCodeImg.src = '';
            }
        }
        
        // 当文档加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            log('页面加载完成');
            initWebChannel();
            
            // 添加测试按钮点击事件
            document.getElementById('testBtn').addEventListener('click', getPaymentQrCode);
        });
    </script>
</body>
</html>
